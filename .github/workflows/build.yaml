name: Frontend CI

on:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # setup-node provides the right Node.js version and caches npm dependencies.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Tests run before the build so broken code never even gets built.
      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Create production build
        run: npm run build -- --configuration production

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          protocol: ftps
          port: 21
          security: loose

          local-dir: ./dist/portfolio/browser/
          server-dir: /christopher-hipper.de/

          log-level: verbose