<header>

    <div class="input-container">
        <input type="checkbox" id="burger" class="checkbox3 visuallyHidden container"
            [checked]="nav.mobileNavIsOpen()"  (change)="onToggle($event)">
        <label for="burger" class="container">

                <span class="bar bar1"></span>
                <span class="bar bar2"></span>
                <span class="bar bar3"></span>
                <span class="bar bar4"></span>
            </div>
        </label>
    </div>
</header>
