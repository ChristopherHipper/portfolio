<nav>
    <ul>
        @for (project of projects(); track project.name; let i = $index ) {
            <li [class.active-project]="project.name === activeProject()" (click)="getProjectName(project.name)">
                 <button>{{ i+1 + '. ' + project.label }} </button>
            </li>
        }
    </ul>
</nav>
