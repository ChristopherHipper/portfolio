<section class="fade-in">
    <h2 >{{ 'SKILLS.title' | translate }}</h2>
    <div class="skills-container">
        <div class="skills slide-left">
            @for (skill of skills; track skill) {
            <app-single-skill [skill]="skill"></app-single-skill>
            }
        </div>
        <article class="current-learning slide-right">
            <p class="current-learning__headline">{{ 'SKILLS.info' | translate }}</p>
            <div class="current-learning__info">
                <p> <strong>{{ 'SKILLS.paragraph' | translate }}:</strong><br>{{ 'SKILLS.text' | translate }}</p>
                <app-single-skill [currentlearning]="true" [skill]="'Claude'"></app-single-skill>
            </div>
        </article>
    </div>
    <div class="btn-container">
        <app-primary-button>
            <a class="primary-btn" [routerLink]="[]" [fragment]="'contact'">{{ 'ABOUTME.button' | translate }}</a>
        </app-primary-button>
    </div>
</section>
