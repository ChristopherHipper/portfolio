<section class="fade-in">
    <div class="testimation">
        <h3 class="testimation__headline">{{ 'FEEDBACK.title' | translate }}</h3>
        <p class="testimation__text">{{ 'FEEDBACK.title-text' | translate }}</p>
    </div>
    <article>
        @for (feedback of feedbacks; track feedback.name ; let i = $index) {
            <app-feedback [feedback]="feedback"></app-feedback>
        }
    </article>
</section>
