<div class="hero">
    @if (mobile()) {
    <div class="hero__mobile">
        <app-mobile-nav></app-mobile-nav>
    </div>
    }

    <figure class="hero__img">
        <!-- <img src="" alt=""> -->
    </figure>
    <div class="hero__content">
        @if (!mobile()) {
        <app-logo [logoVariant]="'hero'"></app-logo>
        }
        <div class="hero__text">
            <h1>Christopher Hipper</h1>
            <p>FRONTEND DEVELOPER</p>
        </div>
        <app-scroll-indicator [scrollDirection]="'down'" [scrollTarget]="'Why me'"></app-scroll-indicator>
    </div>

    <div class="hero__sozialmedia-container">
        <nav class="hero__sozialmedia">
            @for (icon of icons(); track $index) {
            <app-sozial-media-icons [iconImg]="icon"></app-sozial-media-icons>
            }
        </nav>
    </div>
</div>
